# CI: runs all tests on every push / PR to main
name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 19 * * 0-4'   # 02:00 VN, Mon–Fri
  workflow_dispatch:
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - name: Test summary
      if: ${{ !cancelled() }}
      run: |
        echo "## Playwright results" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Passed: $(jq '.stats.expected' results.json)" >> $GITHUB_STEP_SUMMARY
        echo "- ❌ Failed: $(jq '.stats.unexpected' results.json)" >> $GITHUB_STEP_SUMMARY
        echo "- ⚠️ Flaky: $(jq '.stats.flaky' results.json)" >> $GITHUB_STEP_SUMMARY
        echo "- 📄 Full HTML report: download **playwright-report** in Artifacts below" >> $GITHUB_STEP_SUMMARY
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
